<div class="container mt-4" *ngIf="barrio">
  <h2>Detalle de Barrio</h2>

  <div class="card">
    <div class="card-body">
      <h5 class="card-title">ID: {{ barrio.id }}</h5>
      <p class="card-text"><strong>Nombre:</strong> {{ barrio.name }}</p>

      <h6 class="card-subtitle mb-2 text-muted">Coordenadas:</h6>
      <ul class="list-group list-group-flush">
        <li class="list-group-item" *ngFor="let coord of barrio.coordenadas">
          Latitud: {{ coord.latitud }}, Longitud: {{ coord.longitud }}
        </li>
      </ul>
    </div>
  </div>

  <a [routerLink]="['/barrios/list']" class="btn btn-primary mt-3">Volver a la lista</a>
</div>

<div class="container mt-4" *ngIf="!barrio">
  <p>Cargando...</p>
</div>
