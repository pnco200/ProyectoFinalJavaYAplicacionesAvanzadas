<div class="container mt-4" *ngIf="zona">
  <div class="card">
    <div class="card-header bg-primary text-white">
      <h2 class="mb-0">Detalle de Zona</h2>
    </div>
    <div class="card-body">
      <dl class="row">
        <dt class="col-sm-3">ID:</dt>
        <dd class="col-sm-9">{{ zona.id }}</dd>

        <dt class="col-sm-3">Color:</dt>
        <dd class="col-sm-9">{{ zona.color }}</dd>

        <dt class="col-sm-3">Barrio ID:</dt>
        <dd class="col-sm-9">{{ zona.barrioId }}</dd>
      </dl>

      <h6 class="card-subtitle mt-4 mb-2 text-muted">Coordenadas:</h6>
      <ul class="list-group list-group-flush">
        <li class="list-group-item" *ngFor="let coord of zona.coordenadas">
          Latitud: {{ coord.latitud }}, Longitud: {{ coord.longitud }}
        </li>
      </ul>
      <a [routerLink]="['/zonas/list']" class="btn btn-secondary mt-3">Volver a la lista</a>
    </div>
  </div>
</div>

<div class="container mt-4" *ngIf="!zona">
  <p>Cargando...</p>
</div>
