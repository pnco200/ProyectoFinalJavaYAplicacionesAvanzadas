
<div class="container">
  <h2>Renglones</h2>
  <button class="btn btn-primary mb-3" [routerLink]="['/renglones/create']">Create Renglon</button>
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Valor</th>
        <th>Tipo</th>
        <th>Encuesta ID</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let renglon of renglones">
        <td>{{ renglon.id }}</td>
        <td>{{ renglon.valor }}</td>
        <td>{{ renglon.tipo }}</td>
        <td>{{ renglon.encuestaId }}</td>
        <td>
          <button class="btn btn-info btn-sm" (click)="viewRenglon(renglon.id)">View</button>
          <button class="btn btn-warning btn-sm" (click)="editRenglon(renglon.id)">Edit</button>
          <button class="btn btn-danger btn-sm" (click)="deleteRenglon(renglon.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
