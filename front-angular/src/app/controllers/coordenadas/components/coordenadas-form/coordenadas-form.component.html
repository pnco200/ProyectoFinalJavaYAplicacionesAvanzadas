<div class="container mt-4">
  <div class="card">
    <div class="card-header bg-primary text-white">
      <h2 class="mb-0">{{ isEditMode ? 'Editar' : 'Crear' }} Coordenada</h2>
    </div>
    <div class="card-body">
      <form [formGroup]="coordenadaForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="latitud" class="form-label">Latitud</label>
          <input type="text" id="latitud" class="form-control" formControlName="latitud">
          <div *ngIf="coordenadaForm.get('latitud')?.invalid && coordenadaForm.get('latitud')?.touched" class="text-danger">
            Latitud es requerida y debe ser un número.
          </div>
        </div>

        <div class="mb-3">
          <label for="longitud" class="form-label">Longitud</label>
          <input type="text" id="longitud" class="form-control" formControlName="longitud">
          <div *ngIf="coordenadaForm.get('longitud')?.invalid && coordenadaForm.get('longitud')?.touched" class="text-danger">
            Longitud es requerida y debe ser un número.
          </div>
        </div>

        <div class="mb-3">
          <label for="barrio" class="form-label">Barrio (Opcional)</label>
          <select id="barrio" class="form-control" formControlName="barrio" [compareWith]="compareById">
            <option [ngValue]="null">-- Seleccione un Barrio --</option>
            <option *ngFor="let barrio of barrios" [ngValue]="barrio">{{ barrio.name }}</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="zona" class="form-label">Zona (Opcional)</label>
          <select id="zona" class="form-control" formControlName="zona" [compareWith]="compareById">
            <option [ngValue]="null">-- Seleccione una Zona --</option>
            <option *ngFor="let zona of zonas" [ngValue]="zona">{{ zona.color }}</option>
          </select>
        </div>

        <p class="text-muted">Una coordenada debe pertenecer a un barrio o a una zona, pero no a ambos.</p>

        <div class="d-flex justify-content-between">
          <button type="submit" class="btn btn-success" [disabled]="coordenadaForm.invalid">{{ isEditMode ? 'Actualizar' : 'Crear' }}</button>
          <a [routerLink]="['/coordenadas/list']" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
