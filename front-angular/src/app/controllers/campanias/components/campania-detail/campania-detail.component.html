<div class="container mt-4" *ngIf="campania">
  <div class="card">
    <div class="card-header bg-primary text-white">
      <h2 class="mb-0">Detalles de la Campaña</h2>
    </div>
    <div class="card-body">
      <dl class="row">
        <dt class="col-sm-3">ID:</dt>
        <dd class="col-sm-9">{{ campania.id }}</dd>

        <dt class="col-sm-3">Nombre:</dt>
        <dd class="col-sm-9">{{ campania.name }}</dd>

        <dt class="col-sm-3">Fecha de Inicio:</dt>
        <dd class="col-sm-9">{{ campania.startDate | date:'dd/MM/yyyy' }}</dd>

        <dt class="col-sm-3">Fecha de Fin:</dt>
        <dd class="col-sm-9">{{ campania.endDate | date:'dd/MM/yyyy' }}</dd>
      </dl>
      <a routerLink="/campanias" class="btn btn-secondary">Volver a la Lista</a>
    </div>
  </div>
</div>
