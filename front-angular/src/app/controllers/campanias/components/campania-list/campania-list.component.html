<div class="container mt-4">
  <div class="card">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h2 class="mb-0">Lista de Campañas</h2>
      <a routerLink="/campanias/nuevo" class="btn btn-light">Crear Nueva Campaña</a>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Fecha de Inicio</th>
              <th>Fecha de Fin</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let campania of campanias">
              <td>{{ campania.id }}</td>
              <td>{{ campania.name }}</td>
              <td>{{ campania.startDate | date:'dd/MM/yyyy' }}</td>
              <td>{{ campania.endDate | date:'dd/MM/yyyy' }}</td>
              <td>
                <a [routerLink]="['/campanias', campania.id]" class="btn btn-info btn-sm me-2">Ver</a>
                <a [routerLink]="['/campanias', campania.id, 'editar']" class="btn btn-warning btn-sm me-2">Editar</a>
                <button (click)="deleteCampania(campania.id)" class="btn btn-danger btn-sm">Eliminar</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
