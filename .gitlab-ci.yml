buildDocker:
  stage: build
  tags:
    - jyaa
  only:
    - main
  script:
    - echo "Construimos la imagen de Docker"
    - docker buildx build . -t grupo10-docker

detenemosContainer:
  stage: test
  tags:
    - jyaa
  needs:
    - buildDocker
  only:
    - main
  script:
    - echo "Detenemos cualqueir tipo de contenedor existente previo"
    - docker stop grupo10 || true

eliminamosContainer:
  stage: test
  tags:
    - jyaa
  only:
    - main
  needs:
    - detenemosContainer
  script:
    - echo "Eliminamos cualqueir tipo de contenedor existente previo"
    - docker rm grupo10 || true

deploy1:
  stage: deploy
  tags:
    - jyaa
  needs:
    - eliminamosContainer
  only:
    - main
  script:
    - echo "Deploy del nuevo contenedor con los cambios"
    - docker run --network javaproyec_jyaa-network -p 8090:8080 -l "traefik.enable=true" -l "traefik.http.routers.grupo10.rule=Host(\`grupo10.jyaa-ci.linti.unlp.edu.ar\`)" -l "traefik.http.routers.grupo10.entrypoints=websecure" -l "traefik.http.routers.grupo10.tls.certresolver=le" -l "traefik.http.services.grupo10.loadbalancer.server.port=8080" -d --name grupo10 grupo10-docker

verLogs:
  stage: deploy
  tags:
    - jyaa
  needs:
    - deploy1
  only:
    - main
  when: manual
  script:
    - echo "Ver ultimos logs"
    - docker logs --tail=200 grupo10
