<div class="container mt-4" *ngIf="campania">
  <div class="row">
    <!-- Left column: Details -->
    <div class="col-md-6">
      <div class="card h-100">
        <div class="card-header bg-primary text-white">
          <h2 class="mb-0">Detalles de la Campaña</h2>
        </div>
        <div class="card-body">
          <dl class="row">
            <dt class="col-sm-4">ID:</dt>
            <dd class="col-sm-8">{{ campania.id }}</dd>

            <dt class="col-sm-4">Nombre:</dt>
            <dd class="col-sm-8">{{ campania.name }}</dd>

            <dt class="col-sm-4">Fecha de Inicio:</dt>
            <dd class="col-sm-8">{{ campania.startDate | date:'dd/MM/yyyy' }}</dd>

            <dt class="col-sm-4">Fecha de Fin:</dt>
            <dd class="col-sm-8">{{ campania.endDate | date:'dd/MM/yyyy' }}</dd>

            <dt class="col-sm-4">Barrio ID:</dt>
            <dd class="col-sm-8">{{ campania.barrioId }}</dd>

            <dt class="col-sm-4">Barrio Nombre:</dt>
            <dd class="col-sm-8">{{ barrio?.name }}</dd>
          </dl>
          <a routerLink="/campanias" class="btn btn-secondary">Volver a la Lista</a>
        </div>
      </div>
    </div>

    <!-- Right column: Filters component + buttons -->
    <div class="col-md-6 d-flex flex-column">
      <!-- Filters component -->
      <div class="mb-3">
        <app-campania-filters [campaniaId]="campania.id"></app-campania-filters>
      </div>

      <!-- Buttons section -->
      <div class="card">
        <div class="card-header bg-light">
          <h5 class="mb-0">Acciones</h5>
        </div>
        <div class="card-body">
          <div class="d-grid gap-2">
            <button class="btn btn-primary" (click)="verMapa()">Ver Mapa</button>
            <button class="btn btn-success" (click)="verResultados()">Ver Resultados</button>
            <button class="btn btn-warning" (click)="verGraficos()">Ver Gráficos</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
