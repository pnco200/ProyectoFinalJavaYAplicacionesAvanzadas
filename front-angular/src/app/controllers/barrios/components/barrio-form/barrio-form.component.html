<div class="container mt-4">
  <div class="card">
    <div class="card-header bg-primary text-white">
      <h2 class="mb-0">{{ isEditMode ? 'Editar' : 'Crear' }} Barrio</h2>
    </div>
    <div class="card-body">
      <form [formGroup]="barrioForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre del Barrio</label>
          <input type="text" id="nombre" class="form-control" formControlName="nombre">
          <div *ngIf="barrioForm.get('nombre')?.invalid && barrioForm.get('nombre')?.touched" class="text-danger">
            Nombre es requerido.
          </div>
        </div>

        <h3 class="mt-4">Coordenadas</h3>
        <div formArrayName="coordenadas">
          <div *ngFor="let coordGroup of coordenadas.controls; let i = index" [formGroupName]="i" class="card mb-3">
            <div class="card-body">
              <h5 class="card-title">Coordenada {{ i + 1 }}</h5>
              <div class="mb-3">
                <label for="latitud-{{i}}" class="form-label">Latitud</label>
                <input type="text" id="latitud-{{i}}" class="form-control" formControlName="latitud">
                <div *ngIf="coordGroup.get('latitud')?.invalid && coordGroup.get('latitud')?.touched" class="text-danger">
                  Latitud es requerida y debe ser un número.
                </div>
              </div>
              <div class="mb-3">
                <label for="longitud-{{i}}" class="form-label">Longitud</label>
                <input type="text" id="longitud-{{i}}" class="form-control" formControlName="longitud">
                <div *ngIf="coordGroup.get('longitud')?.invalid && coordGroup.get('longitud')?.touched" class="text-danger">
                  Longitud es requerida y debe ser un número.
                </div>
              </div>
              <button type="button" class="btn btn-danger btn-sm" (click)="removeCoordenada(i)">Eliminar Coordenada</button>
            </div>
          </div>
        </div>
        <button type="button" class="btn btn-info mb-3" (click)="addCoordenada()">Agregar Coordenada</button>

        <p class="text-muted">Se requieren al menos 3 coordenadas para definir un barrio.</p>

        <div class="d-flex justify-content-between">
          <button type="submit" class="btn btn-success" [disabled]="barrioForm.invalid || coordenadas.length < 3">{{ isEditMode ? 'Actualizar' : 'Crear' }}</button>
          <a [routerLink]="['/barrios/list']" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
