<div class="container mt-4">
  <div class="card">
    <div class="card-header bg-primary text-white">
      <h2 class="mb-0">{{ isEditMode ? 'Editar Campaña' : 'Crear Campaña' }}</h2>
    </div>
    <div class="card-body">
      <form [formGroup]="campaniaForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="name" class="form-label">Nombre</label>
          <input type="text" id="name" formControlName="name" class="form-control">
        </div>
        <div class="mb-3">
          <label for="startDate" class="form-label">Fecha de Inicio</label>
          <input type="date" id="startDate" formControlName="startDate" class="form-control">
        </div>
        <div class="mb-3">
          <label for="endDate" class="form-label">Fecha de Fin</label>
          <input type="date" id="endDate" formControlName="endDate" class="form-control">
        </div>
        <div class="mb-3">
          <label for="barrio" class="form-label">Barrio</label>
          <select id="barrio" formControlName="barrioId" class="form-select">
            <option [ngValue]="null" disabled>Seleccione un barrio</option>
            <option *ngFor="let barrio of barrios" [ngValue]="barrio.id">{{ barrio.name }}</option>
          </select>
        </div>
        <div class="d-flex justify-content-between">
          <button type="submit" class="btn btn-success" [disabled]="!campaniaForm.valid">{{ isEditMode ? 'Actualizar' : 'Crear' }}</button>
          <a routerLink="/campanias" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
