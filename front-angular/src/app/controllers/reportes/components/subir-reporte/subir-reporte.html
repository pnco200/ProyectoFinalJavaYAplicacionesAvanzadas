<div class="form-container">
  <h2>Subir Reporte</h2>
  <form (ngSubmit)="subirReporte()" #reporteForm="ngForm">
    <div class="form-group">
      <label for="file" class="custom-file-upload">Seleccionar archivo PDF</label>
      <input type="file" id="file" (change)="onFileSelected($event)" accept=".pdf" required style="display: none;">
      <span *ngIf="selectedFile">{{ selectedFile.name }}</span>
    </div>
    <div class="form-group">
      <label for="visibilidad">Visibilidad</label>
      <select id="visibilidad" [(ngModel)]="visibilidad" name="visibilidad" required>
        <option value="publico">Público</option>
        <option value="privado">Privado</option>
      </select>
    </div>
    <button type="submit" [disabled]="!reporteForm.form.valid || !selectedFile">Subir Reporte</button>
  </form>
  <div *ngIf="uploadSuccess" class="success-message">
    ¡Reporte subido exitosamente!
  </div>
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>
</div>

<div class="report-list">
  <h3>Reportes Privados</h3>
  <table>
    <thead>
      <tr>
        <th>Nombre del Archivo</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let reporte of reportesPrivados">
        <td>{{ reporte }}</td>
        <td>
          <button (click)="descargarReporte(reporte)">Descargar</button>
          <button (click)="eliminarReporte(reporte)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
