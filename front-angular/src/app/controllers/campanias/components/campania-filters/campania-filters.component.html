<div class="card">
  <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
    <h3 class="mb-0">Filtros</h3>
    <div>
      <button class="btn btn-primary btn-sm me-2" (click)="addFilter()">+</button>
      <button class="btn btn-danger btn-sm" (click)="removeFilter(filters.length - 1)" [disabled]="filters.length === 1">-</button>
    </div>
  </div>
  <div class="card-body">
    <div *ngFor="let filter of filters; let i = index" class="row mb-2">
      <div class="col-md-5">
        <select class="form-select" [(ngModel)]="filter.tipo" (ngModelChange)="onTipoChange(filter)">
          <option value="">Seleccione un tipo</option>
          <option *ngFor="let tipo of getAvailableTipos(filter)" [value]="tipo[0]">{{ tipo[0] }} ({{ tipo[1] }})</option>
        </select>
      </div>
      <div class="col-md-5">
        <select class="form-select" [(ngModel)]="filter.value" [disabled]="!filter.tipo">
          <option value="">Seleccione un valor</option>
          <option *ngFor="let valor of getAvailableValores(filter)" [value]="valor">{{ valor }}</option>
        </select>
      </div>
    </div>
    <button class="btn btn-success mt-3" (click)="saveFilters()">GUARDAR</button>
  </div>
</div>
