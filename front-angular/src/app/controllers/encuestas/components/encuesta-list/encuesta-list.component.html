
<div class="container mt-4">
  <div class="card">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h2 class="mb-0">Encuestas</h2>
      <button class="btn btn-light" [routerLink]="['/encuestas/create']">Crear Encuesta</button>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>ID</th>
              <th>Tipo</th>
              <th>Campaña ID</th>
              <th>Vivienda ID</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let encuesta of encuestas">
              <td>{{ encuesta.id }}</td>
              <td>{{ encuesta.tipo }}</td>
              <td>{{ encuesta.campaniaId }}</td>
              <td>{{ encuesta.viviendaId }}</td>
              <td>
                <button class="btn btn-info btn-sm me-2" (click)="viewEncuesta(encuesta.id)">Ver</button>
                <button class="btn btn-danger btn-sm" (click)="deleteEncuesta(encuesta.id)">Eliminar</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
