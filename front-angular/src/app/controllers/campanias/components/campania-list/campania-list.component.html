<div class="container">
  <h1>Lista de Campañas</h1>
  <a routerLink="/campanias/nuevo" class="btn btn-primary mb-3">Crear Nueva Campaña</a>
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Fecha de Inicio</th>
        <th>Fecha de Fin</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let campania of campanias">
        <td>{{ campania.id }}</td>
        <td>{{ campania.name }}</td>
        <td>{{ campania.startDate | date:'dd/MM/yyyy' }}</td>
        <td>{{ campania.endDate | date:'dd/MM/yyyy' }}</td>
        <td>
          <a [routerLink]="['/campanias', campania.id]" class="btn btn-info btn-sm">Ver</a>
          <a [routerLink]="['/campanias', campania.id, 'editar']" class="btn btn-warning btn-sm">Editar</a>
          <button (click)="deleteCampania(campania.id)" class="btn btn-danger btn-sm">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
