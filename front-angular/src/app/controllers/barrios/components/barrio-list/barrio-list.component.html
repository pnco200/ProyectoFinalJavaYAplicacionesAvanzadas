<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Barrios</h2>
    <button class="btn btn-primary" [routerLink]="['/barrios/new']">Crear Barrio</button>
  </div>

  <table class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th scope="col">ID</th>
        <th scope="col">Nombre</th>
        <th scope="col">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let barrio of barrios">
        <th scope="row">{{ barrio.id }}</th>
        <td>{{ barrio.name }}</td>
        <td>
          <button class="btn btn-sm btn-info me-2" (click)="viewBarrio(barrio.id)">Ver</button>
          <button class="btn btn-sm btn-warning me-2" (click)="editBarrio(barrio.id)">Editar</button>
          <button class="btn btn-sm btn-danger" (click)="deleteBarrio(barrio.id)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
