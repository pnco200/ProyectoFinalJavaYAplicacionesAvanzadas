<div class="user-form-container">
  <h2>{{ isEditMode ? 'Editar Usuario' : 'Nuevo Usuario' }}</h2>
  <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="dni">DNI:</label>
      <input type="text" id="dni" formControlName="dni">
      <div *ngIf="userForm.controls['dni'].invalid && (userForm.controls['dni'].dirty || userForm.controls['dni'].touched)" class="error-message">
        <div *ngIf="userForm.controls['dni'].errors?.['required']">DNI es requerido.</div>
        <div *ngIf="userForm.controls['dni'].errors?.['pattern']">DNI debe tener 7 u 8 dígitos.</div>
      </div>
    </div>

    <div class="form-group">
      <label for="apellido">Apellido:</label>
      <input type="text" id="apellido" formControlName="apellido">
      <div *ngIf="userForm.controls['apellido'].invalid && (userForm.controls['apellido'].dirty || userForm.controls['apellido'].touched)" class="error-message">
        <div *ngIf="userForm.controls['apellido'].errors?.['required']">Apellido es requerido.</div>
      </div>
    </div>

    <div class="form-group">
      <label for="nombres">Nombres:</label>
      <input type="text" id="nombres" formControlName="nombres">
      <div *ngIf="userForm.controls['nombres'].invalid && (userForm.controls['nombres'].dirty || userForm.controls['nombres'].touched)" class="error-message">
        <div *ngIf="userForm.controls['nombres'].errors?.['required']">Nombres es requerido.</div>
      </div>
    </div>

    <div class="form-group">
      <label for="domicilio">Domicilio:</label>
      <input type="text" id="domicilio" formControlName="domicilio">
      <div *ngIf="userForm.controls['domicilio'].invalid && (userForm.controls['domicilio'].dirty || userForm.controls['domicilio'].touched)" class="error-message">
        <div *ngIf="userForm.controls['domicilio'].errors?.['required']">Domicilio es requerido.</div>
      </div>
    </div>

    <div class="form-group">
      <label for="genero">Género:</label>
      <select id="genero" formControlName="genero">
        <option value="">Seleccione</option>
        <option value="Masculino">Masculino</option>
        <option value="Femenino">Femenino</option>
        <option value="Otro">Otro</option>
      </select>
      <div *ngIf="userForm.controls['genero'].invalid && (userForm.controls['genero'].dirty || userForm.controls['genero'].touched)" class="error-message">
        <div *ngIf="userForm.controls['genero'].errors?.['required']">Género es requerido.</div>
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" formControlName="email">
      <div *ngIf="userForm.controls['email'].invalid && (userForm.controls['email'].dirty || userForm.controls['email'].touched)" class="error-message">
        <div *ngIf="userForm.controls['email'].errors?.['required']">Email es requerido.</div>
        <div *ngIf="userForm.controls['email'].errors?.['email']">Email no válido.</div>
      </div>
    </div>

    <button type="submit" [disabled]="userForm.invalid">{{ isEditMode ? 'Actualizar' : 'Registrar' }}</button>
    <button type="button" (click)="cancel()">Cancelar</button>
  </form>
</div>
