<div class="container mt-4">
  <h2>Lista de Renglones Filtrados</h2>

  <div *ngIf="renglones.length === 0" class="alert alert-warning" role="alert">
    No se encontraron renglones con los filtros aplicados.
  </div>

  <div *ngIf="renglones.length > 0">
    <table class="table table-striped table-bordered">
      <thead class="thead-dark">
        <tr>
          <th>Tipo</th>
          <th>Latitud</th>
          <th>Longitud</th>
          <th>Vivienda ID</th>
          <th>Encuesta ID</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let renglon of renglones">
          <td>{{ renglon.tipo }}</td>
          <td>{{ renglon.latitud }}</td>
          <td>{{ renglon.longitud }}</td>
          <td>{{ renglon.vivienda_id }}</td>
          <td>{{ renglon.encuesta_id }}</td>
          <td>
            <button class="btn btn-info btn-sm" (click)="verResultados(renglon)">Ver Resultados</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
