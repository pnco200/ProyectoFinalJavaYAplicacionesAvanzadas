<div class="container mt-4">
  <div class="card">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h2 class="mb-0">Barrios</h2>
      <button class="btn btn-light" [routerLink]="['/barrios/new']">Crear Barrio</button>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let barrio of barrios">
              <td>{{ barrio.id }}</td>
              <td>{{ barrio.name }}</td>
              <td>
                <button class="btn btn-info btn-sm me-2" (click)="viewBarrio(barrio.id)">Ver</button>
                <button class="btn btn-warning btn-sm me-2" (click)="editBarrio(barrio.id)">Editar</button>
                <button class="btn btn-danger btn-sm" (click)="deleteBarrio(barrio.id)">Eliminar</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
