<div class="container mt-4">
  <div class="card">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h2 class="mb-0">Listado de Usuarios</h2>
      <button class="btn btn-light" (click)="goToNewUser()">Nuevo Usuario</button>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>DNI</th>
              <th>Apellido y Nombres</th>
              <th>Email</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of users">
              <td>{{ user.dni }}</td>
              <td>{{ user.apellido }}, {{ user.nombres }}</td>
              <td>{{ user.email }}</td>
              <td>{{ user.activo ? 'Habilitado' : 'Deshabilitado' }}</td>
              <td>
                <button class="btn btn-info btn-sm me-2" (click)="viewUserDetail(user.id)">Ver</button>
                <button class="btn btn-warning btn-sm me-2" (click)="editUser(user.id)">Editar</button>
                <button class="btn btn-danger btn-sm me-2" (click)="deleteUser(user.id)">Eliminar</button>
                <button class="btn btn-secondary btn-sm" (click)="toggleUserStatus(user)">
                  {{ user.activo ? 'Deshabilitar' : 'Habilitar' }}
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div *ngIf="users.length === 0" class="alert alert-info mt-3">
        No hay usuarios registrados.
      </div>
    </div>
  </div>
</div>
