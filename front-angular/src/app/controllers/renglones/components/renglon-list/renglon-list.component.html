
<div class="container mt-4">
  <div class="card">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h2 class="mb-0">Renglones</h2>
      <button class="btn btn-light" [routerLink]="['/renglones/new']">Crear Renglón</button>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>ID</th>
              <th>Valor</th>
              <th>Tipo</th>
              <th>Encuesta ID</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let renglon of renglones">
              <td>{{ renglon.id }}</td>
              <td>{{ renglon.valor }}</td>
              <td>{{ renglon.tipo }}</td>
              <td>{{ renglon.encuestaId }}</td>
              <td>
                <button class="btn btn-info btn-sm me-2" (click)="viewRenglon(renglon.id)">Ver</button>
                <button class="btn btn-warning btn-sm me-2" (click)="editRenglon(renglon.id)">Editar</button>
                <button class="btn btn-danger btn-sm" (click)="deleteRenglon(renglon.id)">Eliminar</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
